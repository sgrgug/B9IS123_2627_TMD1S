// Ex.2
const sumOfAllMul = (a, b, n) => {
  let sum = 0;
  for (let i = 1; i < n; i++) {
    if(i % a === 0 || i % b === 0) {
      sum = sum + i
    }
  }

  return sum;
}

const sumAll = sumOfAllMul(3, 5, 10)
console.log("testing", sumAll)
